<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>费曼的心理岛 - 文档阅读</title>
    <style>
        /* 1. 默认隐藏页面，防止加载瞬间内容外泄 */
        body { display: none; margin: 0; padding: 0; background-color: #f5f5f5; font-family: "Microsoft Yahei", sans-serif; height: 100vh; overflow: hidden; }
        .main-wrapper { display: flex; flex-direction: column; height: 100vh; padding: 10px; }
        .header { background: white; padding: 12px 20px; border-radius: 8px 8px 0 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        #viewer-container { flex: 1; background: #fff; border-radius: 0 0 8px 8px; overflow: hidden; border: 1px solid #ddd; position: relative; }
        /* 核心：让 iframe 撑满容器，实现顺畅滚动 */
        iframe { width: 100%; height: 100%; border: none; }
        .error { color: #ff4d4f; text-align: center; padding: 50px; background: white; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="header" id="header">
            <span id="doc-title" style="font-weight: bold; color: #333; font-size: 14px;">正在载入书籍...</span>
            <span style="color: #28a745; font-size: 12px; font-weight: bold;">✅ 授权环境访问</span>
        </div>
        <div id="viewer-container"></div>
        <div id="error-tips" class="error" style="display: none;"></div>
    </div>

    <script>
        // 1. 安全锁：拦截右键和 F12 (保护版权)
        document.oncontextmenu = () => false;
        document.onkeydown = (e) => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && e.keyCode === 73)) return false;
        };

        // 2. 环境监测：仅限飞书和 Notion 内部打开
        (function() {
            const isIframe = window.self !== window.top;
            const isAuthorized = document.referrer.includes('feishu.cn') || 
                               document.referrer.includes('notion.so') || 
                               navigator.userAgent.includes('Lark');
            if (!isIframe && !isAuthorized) {
                window.location.href = "about:blank"; // 非授权直接空白
                return;
            }
            document.body.style.display = "block"; // 通过检测后再显示 body
        })();

        // 3. 注册缓存 (sw.js)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            return r != null ? decodeURIComponent(r[2]) : null;
        }

        window.onload = function() {
            const link = getUrlParam('link');
            const container = document.getElementById('viewer-container');
            const errorTips = document.getElementById('error-tips');
            const titleElement = document.getElementById('doc-title');

            if (!link) {
                errorTips.style.display = 'block';
                errorTips.innerText = '错误：未检测到文档链接';
                return;
            }

            // 更新标题
            const fileName = link.split('/').pop().split('?')[0];
            titleElement.innerText = "正在阅读: " + decodeURIComponent(fileName);

            const ext = link.split('.').pop().toLowerCase();
            let previewUrl = '';

            // --- 核心预览逻辑回归 ---
            if (['pdf', 'txt'].includes(ext)) {
                // PDF和TXT直接用浏览器/飞书原生能力，最顺畅
                previewUrl = link;
            } else if (['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'].includes(ext)) {
                // Office 文件使用微软接口预览
                previewUrl = 'https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(link);
            } else {
                errorTips.style.display = 'block';
                errorTips.innerText = '不支持预览此格式';
                return;
            }

            // 创建 iframe 加载
            const iframe = document.createElement('iframe');
            iframe.src = previewUrl;
            container.innerHTML = "";
            container.appendChild(iframe);
        };
    </script>
</body>
</html>
