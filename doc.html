<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>费曼的心理岛 - 文档阅读</title>
    <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview/dist/docx-preview.min.js"></script>
    <style>
        /* 默认隐藏，只有检测通过才显示 */
        body { display: none; margin: 0; padding: 0; background-color: #f5f5f5; font-family: "Microsoft Yahei", sans-serif; height: 100vh; overflow: hidden; }
        .main-wrapper { display: flex; flex-direction: column; height: 100vh; padding: 10px; }
        .header { background: white; padding: 12px 20px; border-radius: 8px 8px 0 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        #viewer-container { flex: 1; background: #fff; border-radius: 0 0 8px 8px; overflow-y: auto; border: 1px solid #ddd; padding: 0; position: relative; }
        /* 顺畅模式的关键：让 iframe 铺满 */
        iframe { width: 100%; height: 100%; border: none; }
        .loading-tips { text-align: center; padding: 50px; color: #666; font-size: 14px; }
        .docx-wrapper { background-color: #fff !important; padding: 20px !important; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="header">
            <span id="doc-title" style="font-weight: bold; color: #333; font-size: 14px;">正在载入...</span>
            <span style="color: #28a745; font-size: 12px; font-weight: bold;">✅ 授权环境访问</span>
        </div>
        <div id="viewer-container">
            <div id="loading" class="loading-tips">书籍正在搬运中...</div>
        </div>
    </div>

    <script>
        // 1. 安全锁：拦截右键、F12 (保护版权)
        document.oncontextmenu = () => false;
        document.onkeydown = (e) => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && e.keyCode === 73)) return false;
        };

        // 2. 环境监测 (确保在飞书/Notion内打开)
        (function() {
            const isIframe = window.self !== window.top;
            const isAuthorized = document.referrer.includes('feishu.cn') || 
                               document.referrer.includes('notion.so') || 
                               navigator.userAgent.includes('Lark');
            if (!isIframe && !isAuthorized) {
                window.location.href = "about:blank";
                return;
            }
            document.body.style.display = "block";
        })();

        // 3. 注册缓存服务 (sw.js)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            return r != null ? decodeURIComponent(r[2]) : null;
        }

        window.onload = async function() {
            const link = getUrlParam('link');
            const container = document.getElementById('viewer-container');
            const loading = document.getElementById('loading');
            const titleElement = document.getElementById('doc-title');

            if (!link) {
                loading.innerText = "❌ 错误：未检测到有效路径";
                return;
            }

            const fileName = link.split('/').pop().split('?')[0];
            titleElement.innerText = "阅读中: " + decodeURIComponent(fileName);
            const ext = fileName.split('.').pop().toLowerCase();

            try {
                // --- 恢复 A: PDF 顺畅加载模式 (直接使用原链接) ---
                if (ext === 'pdf') {
                    const iframe = document.createElement('iframe');
                    // 直接将链接赋给 src，这是飞书里最顺畅的方式
                    iframe.src = link; 
                    container.innerHTML = "";
                    container.appendChild(iframe);
                } 
                // --- 保持 B: Word 本地渲染 (免微软接口) ---
                else if (ext === 'docx') {
                    const response = await fetch(link);
                    const arrayBuffer = await response.arrayBuffer();
                    container.innerHTML = "";
                    docx.renderAsync(arrayBuffer, container, null, { className: "docx" });
                } 
                // --- 保持 C: TXT 乱码修复逻辑 ---
                else if (ext === 'txt') {
                    const response = await fetch(link);
                    const arrayBuffer = await response.arrayBuffer();
                    const text = new TextDecoder('utf-8').decode(arrayBuffer);
                    container.innerHTML = `<pre style="padding:20px; white-space:pre-wrap; font-size:14px; color:#444;">${text}</pre>`;
                } else {
                    loading.innerHTML = "⚠️ 暂不支持该格式预览。";
                }
            } catch (err) {
                loading.innerText = "❌ 资源解析失败，请检查网络或链接。";
            }
        };
    </script>
</body>
</html>
