<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF阅读页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
        body { background-color: #f5f5f5; display: none; height: 100vh; width: 100vw; overflow: hidden; }
        .main-wrapper { display: flex; flex-direction: column; height: 100vh; }
        #viewer-container { flex: 1; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .error { color: #ff4d4f; text-align: center; padding: 50px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div id="viewer-container"></div>
        <div id="error-tips" class="error" style="display: none;"></div>
    </div>

    <script>
        // --- 核心安全验证 (参考 audio.html) ---
        (function() {
            const isIframe = window.self !== window.top;
            if (!isIframe) { window.location.href = "about:blank"; return; }
            document.addEventListener("DOMContentLoaded", () => { document.body.style.display = "block"; });
        })();

        // 防复制锁定
        document.oncontextmenu = () => false;
        document.onkeydown = (e) => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && e.keyCode === 73) || (e.ctrlKey && e.keyCode === 85)) return false;
        };

        // 注册缓存
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }

        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            return r != null ? decodeURIComponent(r[2]) : null;
        }

        window.onload = function() {
            const link = getUrlParam('link');
            const container = document.getElementById('viewer-container');
            const errorTips = document.getElementById('error-tips');

            if (!link) {
                errorTips.style.display = 'block';
                errorTips.innerText = '错误：未检测到文档链接';
                return;
            }

            // 回归最原始、最顺畅的渲染逻辑
            const iframe = document.createElement('iframe');
            iframe.src = link;
            container.appendChild(iframe);
        };
    </script>
</body>
</html>
