<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF预览页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
        body { background-color: #f5f5f5; display: none; height: 100vh; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .error { color: #ff4d4f; text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <div id="viewer" style="width: 100%; height: 100%;">正在开启安全通道...</div>

    <script>
        // --- 复用 audio.html 安全验证 ---
        (function() {
            const isIframe = window.self !== window.top;
            if (!isIframe) { window.location.href = "about:blank"; return; }
            document.addEventListener("DOMContentLoaded", () => { document.body.style.display = "block"; });
        })();
        document.oncontextmenu = () => false;

        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            return r != null ? decodeURIComponent(r[2]) : null;
        }

        window.onload = async function() {
            const link = getUrlParam('link');
            const viewer = document.getElementById('viewer');
            if (!link) return;

            try {
                // 改用 fetch 抓取数据，绕过飞书对 iframe src 的直接拦截
                const response = await fetch(link);
                if (!response.ok) throw new Error("无法读取文件，请检查OSS白名单设置");
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                const iframe = document.createElement('iframe');
                iframe.src = blobUrl; // 加载内存中的本地链接，飞书不会拦截
                viewer.innerHTML = "";
                viewer.appendChild(iframe);
            } catch (err) {
                viewer.innerHTML = `<div class="error">❌ 加载失败: ${err.message}</div>`;
            }
        };
    </script>
</body>
</html>
