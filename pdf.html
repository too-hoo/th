<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF阅读页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f5f5f5; display: none; height: 100vh; width: 100vw; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .error { color: #ff4d4f; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <div id="pdf-box" style="width: 100%; height: 100%;"></div>
    <div id="error-tips" class="error" style="display: none;">加载失败，请检查链接</div>

    <script>
        // --- 核心安全验证 (复用 audio.html) ---
        (function() {
            const isIframe = window.self !== window.top;
            if (!isIframe) { window.location.href = "about:blank"; return; }
            document.addEventListener("DOMContentLoaded", () => { document.body.style.display = "block"; });
        })();
        document.oncontextmenu = () => false;
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }

        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            return r != null ? decodeURIComponent(r[2]) : null;
        }

        window.onload = function() {
            const link = getUrlParam('link');
            if (link) {
                const iframe = document.createElement('iframe');
                // 回归最原始顺畅的直接加载模式
                iframe.src = link;
                document.getElementById('pdf-box').appendChild(iframe);
            } else {
                document.getElementById('error-tips').style.display = 'block';
            }
        };
    </script>
</body>
</html>
